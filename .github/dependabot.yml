version: 2
updates:
    # Lambda runtime + build tooling. package.json lives in app/, not the repo root.
    - package-ecosystem: npm
      directory: /app
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          # One PR for the whole AWS SDK; these version in lockstep and splitting
          # them produces a dozen PRs a week that all have to be merged together.
          aws-sdk:
              patterns:
                  - '@aws-sdk/*'
                  - '@smithy/*'
          # Lint/format/test tooling moves often and rarely affects production code.
          dev-tooling:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          production-minor-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch
      # Majors stay ungrouped so each gets its own PR and its own CI run.
      commit-message:
          prefix: chore
          include: scope

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns:
                  - '*'
      commit-message:
          prefix: chore
