name: Build and Unit Test

on:
    workflow_call:
        # Makes this workflow callable from other workflows

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Lint
              working-directory: app
              run: npm run lint

            - name: Format check
              working-directory: app
              run: npm run format:check

            - name: Lint markdown
              working-directory: app
              run: npm run lint:md

            - name: Lint shell scripts
              # shellcheck is preinstalled on ubuntu-latest runners
              run: shellcheck scripts/*.sh .claude/hooks/*.sh .husky/pre-commit

            - name: Lint GitHub Actions workflows
              uses: docker://rhysd/actionlint:1.7.12
              with:
                  args: -color

            - name: Type check
              working-directory: app
              run: npm run compile

            - name: Unit tests
              # `npm test` also runs tsc, which the Type check step above already
              # did. Run Jest alone here; ts-jest is transpile-only, so types are
              # gated entirely by that step.
              working-directory: app
              run: npm run test:jest

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: Lint CloudFormation template
              run: sam validate --lint

            - name: Lint inline CloudFront Function code
              run: scripts/lint-cloudfront-functions.sh

            - name: SAM build
              run: sam build
