name: Build and Unit Test

on:
    workflow_call:
        # Makes this workflow callable from other workflows

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Lint
              working-directory: app
              run: npm run lint

            - name: Format check
              working-directory: app
              run: npm run format:check

            - name: Lint markdown
              working-directory: app
              run: npm run lint:md

            - name: Lint shell scripts
              # shellcheck is preinstalled on ubuntu-latest runners
              run: shellcheck scripts/*.sh .husky/pre-commit

            - name: Lint GitHub Actions workflows
              uses: docker://rhysd/actionlint:1.7.12
              with:
                  args: -color

            - name: Type check
              working-directory: app
              run: npm run compile

            - name: Unit tests
              working-directory: app
              run: npm test

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Validate changeset (dry-run)
              run: |
                  set -o pipefail
                  sam deploy --no-execute-changeset --no-fail-on-empty-changeset 2>&1 | tee /tmp/changeset.log
                  # Check for changeset creation failure (circular deps, invalid resources, etc.)
                  if grep -q "Failed to create changeset" /tmp/changeset.log; then
                    echo "::error::Changeset validation failed"
                    exit 1
                  fi
