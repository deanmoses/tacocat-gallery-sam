name: Integration Tests

on:
    workflow_dispatch:
    workflow_call:
        # Makes this workflow callable from other workflows

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    integration-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # There is one test stack, and every run deploys to it and then works in
        # fixed test years, so runs from different branches must take turns.
        # Never cancel: the run holding the stack may be a deploy in progress.
        concurrency:
            group: test-stack
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Which role depends on what the token says about the run: the PR role trusts
              # pull request runs and the main role trusts runs on main, so a manual dispatch
              # from another branch fails here. Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::010410881828:role/tacocat-gallery-cicd-github-pr' || 'arn:aws:iam::010410881828:role/tacocat-gallery-cicd-github-main' }}
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Deploy to test stack
              run: sam deploy --config-env test --no-confirm-changeset --no-fail-on-empty-changeset

            - name: Get stack outputs
              id: stack-outputs
              run: |
                  LAMBDA_URL=$(aws cloudformation describe-stacks \
                    --stack-name tacocat-gallery-sam-test \
                    --query "Stacks[0].Outputs[?OutputKey=='GenerateDerivedImageUrl'].OutputValue" \
                    --output text)
                  if [ -z "$LAMBDA_URL" ] || [ "$LAMBDA_URL" = "None" ]; then
                    echo "::error::Failed to retrieve GenerateDerivedImageUrl from stack outputs"
                    exit 1
                  fi
                  DOMAIN=$(echo "$LAMBDA_URL" | sed 's|https://||' | sed 's|/$||')
                  echo "derived_image_domain=$DOMAIN" >> "$GITHUB_OUTPUT"

            - name: Run integration tests
              # Jest alone: `npm run test:integration` also runs tsc, and
              # build-and-unit-test type-checks.
              working-directory: app
              env:
                  GALLERY_ITEM_DDB_TABLE: tacocat-gallery-sam-test-items
                  ORIGINAL_IMAGES_BUCKET: tacocat-gallery-sam-test-original-images
                  DERIVED_IMAGES_BUCKET: tacocat-gallery-sam-test-derived-images
                  DERIVED_IMAGE_GENERATOR_DOMAIN: ${{ steps.stack-outputs.outputs.derived_image_domain }}
                  GALLERY_APP_DOMAIN: test-pix.tacocat.com
                  REDIS_HOST: ${{ secrets.REDIS_TEST_HOST }}
                  REDIS_WRITE_USERNAME: ${{ secrets.REDIS_TEST_WRITE_USERNAME }}
                  REDIS_WRITE_PASSWORD: ${{ secrets.REDIS_TEST_WRITE_PASSWORD }}
                  REDIS_SEARCH_USERNAME: ${{ secrets.REDIS_TEST_SEARCH_USERNAME }}
                  REDIS_SEARCH_PASSWORD: ${{ secrets.REDIS_TEST_SEARCH_PASSWORD }}
              run: npm run test:integration:jest
