name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    # Always runs - detects what files changed
    detect-changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Required for paths-filter to compare commits on push
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  predicate-quantifier: 'every'
                  filters: |
                      code:
                        - '**'
                        - '!**/*.md'
                        - '!LICENSE'
                        - '!.gitignore'
                        - '!docs/**'

    # Only runs if code files changed
    build-and-unit-test:
        needs: detect-changes
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        uses: ./.github/workflows/build-and-unit-test.yml
        secrets: inherit

    deploy:
        needs: build-and-unit-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install esbuild globally
              run: npm install -g esbuild

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v2
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

    integration-test:
        needs: build-and-unit-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/integration-tests.yml
        secrets: inherit
