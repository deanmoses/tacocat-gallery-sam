name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # A push to main must run to completion so the staging deploy is never cut off
    # mid-way. A superseded pull request run can go: the integration suites clean
    # up whatever a cancelled run left behind before they start.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    # Detect if production code changed (vs non-code stuff like docs)
    detect-code-changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            code_changed: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Required for paths-filter to compare commits on push
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  predicate-quantifier: 'every'
                  filters: |
                      code:
                        - '**'
                        - '!**/*.md'
                        - '!LICENSE'
                        - '!.gitignore'
                        - '!docs/**'

    # Only runs if code files changed
    build-and-unit-test:
        needs: detect-code-changes
        if: ${{ needs.detect-code-changes.outputs.code_changed == 'true' }}
        uses: ./.github/workflows/build-and-unit-test.yml
        permissions:
            contents: read

    # The check branch protection requires. Passes when the detector said
    # there were no code changes (so the build and tests were rightly skipped)
    # or the build and the integration tests both succeeded. Anything else,
    # including a detector that answered nothing at all, fails: this must not
    # fail open.
    merge-ok:
        needs: [detect-code-changes, build-and-unit-test, integration-test]
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check required jobs
              run: |
                  if [[ "${{ needs.detect-code-changes.result }}" != "success" ]]; then
                      echo "✗ detect-code-changes failed (result: ${{ needs.detect-code-changes.result }})"
                      exit 1
                  fi
                  if [[ "${{ needs.detect-code-changes.outputs.code_changed }}" == "false" ]]; then
                      echo "✓ No code changes - build was skipped appropriately"
                      exit 0
                  fi
                  if [[ "${{ needs.detect-code-changes.outputs.code_changed }}" != "true" ]]; then
                      echo "✗ Unexpected code_changed value: '${{ needs.detect-code-changes.outputs.code_changed }}'"
                      exit 1
                  fi
                  if [[ "${{ needs.build-and-unit-test.result }}" != "success" ]]; then
                      echo "✗ Code changes detected but build did not succeed (result: ${{ needs.build-and-unit-test.result }})"
                      exit 1
                  fi
                  if [[ "${{ needs.integration-test.result }}" != "success" ]]; then
                      echo "✗ Code changes detected but integration tests did not succeed (result: ${{ needs.integration-test.result }})"
                      exit 1
                  fi
                  echo "✓ Code changes detected, build and integration tests passed"

    # Deploy to staging
    deploy-staging:
        needs: build-and-unit-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role.
              # Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::010410881828:role/tacocat-gallery-cicd-github-main
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

    # Deploy the change to the test stack and run the integration tests against
    # it, gating merge via merge-ok. Pull requests only: the run tests the merge
    # of the branch into main, so with branch protection requiring branches to be
    # up to date, the commit that lands on main is the one already tested. The
    # production deploy workflow runs them again before deploying.
    #
    # Independent of build-and-unit-test: this job builds for itself, the
    # pre-commit hook has already run that job's checks on every commit, and
    # merge-ok requires both jobs.
    integration-test:
        needs: detect-code-changes
        if: ${{ github.event_name == 'pull_request' && needs.detect-code-changes.outputs.code_changed == 'true' }}
        uses: ./.github/workflows/integration-tests.yml
        permissions:
            contents: read
            id-token: write # a called workflow can hold at most the permissions the caller grants
        secrets: inherit # Redis credentials for the tests themselves
