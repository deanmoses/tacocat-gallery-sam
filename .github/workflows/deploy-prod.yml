name: Deploy to Production

on:
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false # Don't cancel in-progress deploys

env:
    HUSKY: 0 # Skip git hooks in CI
    # Dummy values for unit tests (all AWS calls are mocked)
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: testing
    AWS_SECRET_ACCESS_KEY: testing
    GALLERY_ITEM_DDB_TABLE: no-such-table
    ORIGINAL_IMAGES_BUCKET: no-such-bucket
    DERIVED_IMAGES_BUCKET: no-such-bucket
    GALLERY_APP_DOMAIN: no-such-domain
    DERIVED_IMAGE_GENERATOR_DOMAIN: no-such-domain
    REDIS_HOST: no-such-host
    REDIS_WRITE_USERNAME: no-such-user
    REDIS_WRITE_PASSWORD: no-such-password
    REDIS_SEARCH_USERNAME: no-such-user
    REDIS_SEARCH_PASSWORD: no-such-password

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v2
              with:
                  use-installer: true

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Lint
              working-directory: app
              run: npm run lint

            - name: Type check
              working-directory: app
              run: npm run compile

            - name: Unit tests
              working-directory: app
              run: npm test

            - name: SAM build
              run: sam build

    deploy:
        needs: build-and-test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v2
              with:
                  use-installer: true

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: SAM build
              run: sam build

            - name: Deploy to production
              run: sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset

    create-release:
        needs: deploy
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # Required for tags and releases
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Create release tag
              id: tag
              run: |
                  set -e

                  # Get current year
                  year=$(date +%Y)

                  # Find the latest tag for this year
                  latest_tag=$(git tag -l "${year}v*" | sort -V | tail -n1)

                  if [ -z "$latest_tag" ]; then
                      # No tags this year, start at v1
                      new_tag="${year}v1"
                  else
                      # Extract version number and increment
                      version_num=${latest_tag#${year}v}
                      new_version=$((version_num + 1))
                      new_tag="${year}v${new_version}"
                  fi

                  echo "Creating tag: $new_tag"
                  echo "tag=$new_tag" >> $GITHUB_OUTPUT

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "$new_tag" -m "Production release $new_tag"
                  git push origin "$new_tag"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
