name: Deploy to Production

on:
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false # Don't cancel in-progress deploys

env:
    HUSKY: 0 # Skip git hooks in CI

jobs:
    build-and-unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Lint
              working-directory: app
              run: npm run lint

            - name: Format check
              working-directory: app
              run: npm run format:check

            - name: Lint markdown
              working-directory: app
              run: npm run lint:md

            - name: Lint shell scripts
              # shellcheck is preinstalled on ubuntu-latest runners
              run: shellcheck scripts/*.sh .husky/pre-commit

            - name: Lint GitHub Actions workflows
              uses: docker://rhysd/actionlint:1.7.12
              with:
                  args: -color

            - name: Type check
              working-directory: app
              run: npm run compile

            - name: Unit tests
              # `npm test` also runs tsc, which the Type check step above already
              # did. Run Jest alone here; ts-jest is transpile-only, so types are
              # gated entirely by that step.
              working-directory: app
              run: npm run test:jest

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: Lint CloudFormation template
              run: sam validate --lint

            - name: Lint inline CloudFront Function code
              run: scripts/lint-cloudfront-functions.sh

            - name: SAM build
              run: sam build

    integration-test:
        needs: build-and-unit-test
        uses: ./.github/workflows/integration-tests.yml
        secrets: inherit

    deploy:
        needs: integration-test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: app
              run: npm ci

            - name: Add esbuild to PATH
              # esbuild is a devDependency, so package-lock.json pins the version.
              # SAM resolves node_modules relative to each CodeUri rather than to
              # app/, so the binary has to reach it via PATH.
              run: echo "$GITHUB_WORKSPACE/app/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Setup AWS SAM CLI
              uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true

            - name: SAM build
              run: sam build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Deploy to production
              run: sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset

    create-release:
        needs: deploy
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # Required for tags and releases
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Create release tag
              id: tag
              run: |
                  set -e

                  # Get current year
                  year=$(date +%Y)

                  # Find the latest tag for this year
                  latest_tag=$(git tag -l "${year}v*" | sort -V | tail -n1)

                  if [ -z "$latest_tag" ]; then
                      # No tags this year, start at v1
                      new_tag="${year}v1"
                  else
                      # Extract version number and increment
                      version_num=${latest_tag#"${year}"v}
                      new_version=$((version_num + 1))
                      new_tag="${year}v${new_version}"
                  fi

                  echo "Creating tag: $new_tag"
                  echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "$new_tag" -m "Production release $new_tag"
                  git push origin "$new_tag"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
