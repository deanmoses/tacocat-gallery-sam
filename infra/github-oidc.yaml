AWSTemplateFormatVersion: '2010-09-09'
Description: >-
    IAM roles that the tacocat-gallery-sam GitHub Actions workflows assume, the
    CloudFormation service role that deploys the stacks, and the user a Claude
    Code on the web session deploys dev and test as. Deployed by hand, never by
    CI: CI cannot be the thing that creates its own credentials.
    See infra/README.md.

# -----------------------------------------------------------------------------
# How the pieces fit together
#
#   GitHub Actions job ─────(OIDC token)──▶ tacocat-gallery-cicd-github-{pr,main,prod}
#   Claude Code on the web ─(access key)──▶ tacocat-gallery-claude-code-cloud
#                                              │
#                                              │ iam:PassRole + cloudformation:*ChangeSet
#                                              ▼
#                                    tacocat-gallery-cicd-cloudformation
#                                              │
#                                              │ creates/updates every stack resource
#                                              ▼
#                                    tacocat-gallery-sam-{dev,test,prod} stacks
#
# The three GitHub roles hold only what a `sam deploy` needs from the caller's
# side: upload artifacts, create and (except for the PR role) execute change
# sets on their own stacks, and hand CloudFormation its service role. The broad
# permissions needed to actually create Lambdas, buckets, tables and so on live
# on the CloudFormation service role, which only CloudFormation can assume.
#
# The GitHub OIDC identity provider the roles trust is account-wide and lives
# in https://github.com/deanmoses/aws-bootstrap.
#
# Which role a job may assume is decided by the GitHub token's `sub` claim:
#
#   repo:ORG/REPO:pull_request          PR role    dry-run change set on dev
#   repo:ORG/REPO:ref:refs/heads/main   main role  deploy dev + test, run integration tests
#   repo:ORG/REPO:environment:prod      prod role  deploy prod (environment allows protected branches only)
#
# The Claude Code user is the one principal here that carries a long-lived access
# key, because a cloud session has no OIDC token to trade and IAM Identity Center
# needs a browser sign-in that cannot run in one. It reaches as far as the main
# role does, plus read-only access to every environment's logs. Changing prod is
# what an explicit Deny puts out of reach for good.
# -----------------------------------------------------------------------------

Parameters:
    GitHubOrg:
        Type: String
        Default: deanmoses
        Description: GitHub user or organization that owns the repository
    GitHubRepo:
        Type: String
        Default: tacocat-gallery-sam
        Description: GitHub repository name
    ProdEnvironment:
        Type: String
        Default: prod
        Description: Name of the GitHub environment that gates production deploys
    StackPrefix:
        Type: String
        Default: tacocat-gallery-sam
        Description: Prefix of the application stack names, which are the prefix followed by -dev, -test or -prod. Also the prefix of the IAM roles those stacks create.
    SamArtifactBucket:
        Type: String
        Default: aws-sam-cli-managed-default-samclisourcebucket-7tmt1e3o0r12
        Description: The S3 bucket `sam deploy --resolve-s3` uploads build artifacts to (SourceBucket output of the aws-sam-cli-managed-default stack)

Resources:
    # ---------------------------------------------------------------------------
    # CloudFormation service role: does the actual resource creation
    # ---------------------------------------------------------------------------
    CloudFormationDeployRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-cicd-cloudformation
            Description: Service role CloudFormation assumes to deploy the tacocat-gallery-sam stacks
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudformation.amazonaws.com
                      Action: sts:AssumeRole
                      Condition:
                          StringEquals:
                              aws:SourceAccount: !Ref AWS::AccountId
                          ArnLike:
                              aws:SourceArn:
                                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*
                                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-test/*
                                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*
            Policies:
                - PolicyName: DeployGalleryStacks
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          # Same shape as the policy the old CI user carried: everything
                          # except identity management, plus identity management scoped to
                          # the roles the application stacks create for their own Lambdas.
                          - Sid: EverythingExceptIdentity
                            Effect: Allow
                            NotAction:
                                - iam:*
                                - organizations:*
                                - account:*
                            Resource: '*'
                          - Sid: RolesOwnedByTheStacks
                            Effect: Allow
                            Action:
                                - iam:CreateRole
                                - iam:DeleteRole
                                - iam:GetRole
                                - iam:UpdateRole
                                - iam:UpdateAssumeRolePolicy
                                - iam:PassRole
                                - iam:AttachRolePolicy
                                - iam:DetachRolePolicy
                                - iam:PutRolePolicy
                                - iam:DeleteRolePolicy
                                - iam:GetRolePolicy
                                - iam:ListRolePolicies
                                - iam:ListAttachedRolePolicies
                                - iam:TagRole
                                - iam:UntagRole
                            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${StackPrefix}-*

    # ---------------------------------------------------------------------------
    # What every GitHub role needs to run `sam deploy` at all
    # ---------------------------------------------------------------------------
    SamDeployPlumbingPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            ManagedPolicyName: tacocat-gallery-cicd-sam-deploy-plumbing
            Description: Upload SAM artifacts, read the SAM managed bucket stack, and pass the CloudFormation service role
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: UploadBuildArtifacts
                      Effect: Allow
                      Action:
                          - s3:ListBucket
                          - s3:GetBucketLocation
                      Resource: !Sub arn:aws:s3:::${SamArtifactBucket}
                    - Sid: ReadWriteBuildArtifacts
                      Effect: Allow
                      Action:
                          - s3:GetObject
                          - s3:PutObject
                      Resource: !Sub arn:aws:s3:::${SamArtifactBucket}/*
                    - Sid: FindTheArtifactBucket
                      Effect: Allow
                      Action:
                          - cloudformation:DescribeStacks
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                    - Sid: TemplateInspection
                      Effect: Allow
                      Action:
                          - cloudformation:GetTemplateSummary
                          - cloudformation:ValidateTemplate
                      Resource: '*'
                    - Sid: HandCloudFormationItsRole
                      Effect: Allow
                      Action: iam:PassRole
                      Resource: !GetAtt CloudFormationDeployRole.Arn
                      Condition:
                          StringEquals:
                              iam:PassedToService: cloudformation.amazonaws.com
                    - Sid: SamTransform
                      # Creating a change set for a template with a Transform needs
                      # permission on the transform pseudo-resource too
                      Effect: Allow
                      Action: cloudformation:CreateChangeSet
                      Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

    # ---------------------------------------------------------------------------
    # Deploying dev and test, and exercising what a deploy produced. Managed
    # policies rather than inline ones because two principals hold them: the main
    # branch's CI role and the Claude Code user.
    # ---------------------------------------------------------------------------
    DeployDevAndTestPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            ManagedPolicyName: tacocat-gallery-cicd-deploy-dev-and-test
            Description: Create and execute change sets on the dev and test stacks
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Action:
                          - cloudformation:CreateChangeSet
                          - cloudformation:DescribeChangeSet
                          - cloudformation:ExecuteChangeSet
                          - cloudformation:DeleteChangeSet
                          - cloudformation:DescribeStacks
                          - cloudformation:DescribeStackEvents
                          - cloudformation:DescribeStackResources
                          - cloudformation:GetTemplate
                          - cloudformation:ListStackResources
                      Resource:
                          - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*
                          - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-test/*

    IntegrationTestsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Metadata:
            cfn-lint:
                config:
                    ignore_checks:
                        - W3037 # cfn-lint's DynamoDB action list is missing the (real) TransactGetItems and TransactWriteItems
        Properties:
            ManagedPolicyName: tacocat-gallery-cicd-integration-tests
            Description: Read and write the test stack's table and media buckets
            # The integration tests call the gallery library directly, so whoever
            # runs them reads and writes the test stack's table and buckets
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: TestTable
                      Effect: Allow
                      Action:
                          - dynamodb:DescribeTable
                          - dynamodb:GetItem
                          - dynamodb:BatchGetItem
                          - dynamodb:Query
                          - dynamodb:Scan
                          - dynamodb:PutItem
                          - dynamodb:UpdateItem
                          - dynamodb:DeleteItem
                          - dynamodb:BatchWriteItem
                          - dynamodb:ConditionCheckItem
                          # The gallery library issues some reads and writes as PartiQL statements
                          - dynamodb:PartiQLSelect
                          - dynamodb:PartiQLInsert
                          - dynamodb:PartiQLUpdate
                          - dynamodb:PartiQLDelete
                          - dynamodb:TransactGetItems
                          - dynamodb:TransactWriteItems
                      Resource:
                          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-test-items
                          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-test-items/index/*
                    - Sid: TestBuckets
                      Effect: Allow
                      Action:
                          - s3:ListBucket
                          - s3:ListBucketVersions
                          - s3:GetBucketLocation
                      Resource:
                          - !Sub arn:aws:s3:::${StackPrefix}-test-original-images
                          - !Sub arn:aws:s3:::${StackPrefix}-test-derived-images
                    - Sid: TestObjects
                      Effect: Allow
                      Action:
                          - s3:GetObject
                          - s3:GetObjectVersion
                          - s3:GetObjectAttributes
                          - s3:GetObjectTagging
                          - s3:PutObject
                          - s3:PutObjectTagging
                          - s3:DeleteObject
                          - s3:DeleteObjectVersion
                          - s3:AbortMultipartUpload
                      Resource:
                          - !Sub arn:aws:s3:::${StackPrefix}-test-original-images/*
                          - !Sub arn:aws:s3:::${StackPrefix}-test-derived-images/*

    # ---------------------------------------------------------------------------
    # PR role: pull requests dry-run a change set against the dev stack
    # ---------------------------------------------------------------------------
    GitHubPullRequestRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-cicd-github-pr
            Description: Assumed by pull request workflow runs to validate a change set against the dev stack without executing it
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:pull_request
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
            Policies:
                - PolicyName: DryRunChangeSetOnDev
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:CreateChangeSet
                                - cloudformation:DescribeChangeSet
                                - cloudformation:DeleteChangeSet
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeStackEvents
                                - cloudformation:GetTemplate
                                - cloudformation:ListStackResources
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*

    # ---------------------------------------------------------------------------
    # Main role: pushes to main deploy dev and test, then run the integration tests
    # ---------------------------------------------------------------------------
    GitHubMainRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-cicd-github-main
            Description: Assumed by workflow runs on the main branch to deploy the dev and test stacks and run the integration tests
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
                - !Ref DeployDevAndTestPolicy
                - !Ref IntegrationTestsPolicy

    # ---------------------------------------------------------------------------
    # Prod role: only a job running inside the `prod` environment. That environment admits
    # protected branches only, and main is the only one, so this trust rests on that rule alone.
    # ---------------------------------------------------------------------------
    GitHubProdRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: tacocat-gallery-cicd-github-prod
            Description: Assumed by the production deploy job, which runs inside the GitHub environment that only protected branches (main) may deploy from
            MaxSessionDuration: 3600
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${ProdEnvironment}
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
            Policies:
                - PolicyName: DeployProd
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:CreateChangeSet
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ExecuteChangeSet
                                - cloudformation:DeleteChangeSet
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeStackEvents
                                - cloudformation:DescribeStackResources
                                - cloudformation:GetTemplate
                                - cloudformation:ListStackResources
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*

    # ---------------------------------------------------------------------------
    # Reading the application's own logs in every environment, which no CI job
    # does but a person debugging from a Claude Code session does constantly
    # (`sam logs`, `aws logs tail`, Logs Insights).
    # ---------------------------------------------------------------------------
    ReadApplicationLogsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            ManagedPolicyName: tacocat-gallery-read-application-logs
            Description: Read this project's Lambda, API Gateway and CloudFront access logs in every environment, and the X-Ray traces sam logs --include-traces fetches
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: ReadTheLogs
                      Effect: Allow
                      Action:
                          - logs:DescribeLogStreams
                          - logs:GetLogEvents
                          - logs:FilterLogEvents
                          - logs:StartLiveTail
                          - logs:StartQuery
                          - logs:StopQuery
                      # Reading prod is the point: an incident is the moment you most
                      # want the logs, and reading them cannot change anything. The
                      # group names are fixed strings in template.yaml rather than
                      # derived from the stack name.
                      Resource:
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/dev:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/dev/api-access:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/test:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/test/api-access:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/prod:*
                          - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${StackPrefix}/prod/api-access:*
                    - Sid: FindTheLogGroups
                      # `sam logs` lists log groups before reading one, and
                      # GetQueryResults takes a query id rather than a group. Neither
                      # returns log content, so the wildcard costs nothing.
                      Effect: Allow
                      Action:
                          - logs:DescribeLogGroups
                          - logs:GetQueryResults
                          - logs:DescribeQueries
                          # A distribution configured through delivery resources reports
                          # logging disabled in get-distribution-config and the console,
                          # so these are the only way to see whether logs are flowing.
                          - logs:DescribeDeliverySources
                          - logs:DescribeDeliveryDestinations
                          - logs:DescribeDeliveries
                      Resource: '*'
                    - Sid: ReadCloudFrontAccessLogs
                      # The image distribution delivers to S3 rather than a log group,
                      # one gzipped file per batch. The SPA distribution's own logs are
                      # granted by the hosting project, which owns that bucket.
                      Effect: Allow
                      Action:
                          - s3:GetObject
                          - s3:ListBucket
                      Resource:
                          - !Sub arn:aws:s3:::${StackPrefix}-dev-cloudfront-logs
                          - !Sub arn:aws:s3:::${StackPrefix}-dev-cloudfront-logs/*
                          - !Sub arn:aws:s3:::${StackPrefix}-prod-cloudfront-logs
                          - !Sub arn:aws:s3:::${StackPrefix}-prod-cloudfront-logs/*
                    - Sid: Traces
                      # X-Ray has no resource-level permissions, so `sam logs
                      # --include-traces` can only be granted account-wide
                      Effect: Allow
                      Action:
                          - xray:BatchGetTraces
                          - xray:GetTraceSummaries
                      Resource: '*'

    # ---------------------------------------------------------------------------
    # Claude Code on the web: a cloud session has no OIDC token to trade for a
    # role, so this is the one principal with a long-lived access key. The key
    # itself is created by hand and lives in the cloud environment, never in this
    # template -- see infra/README.md.
    # ---------------------------------------------------------------------------
    ClaudeCodeCloudUser:
        Type: AWS::IAM::User
        Properties:
            UserName: tacocat-gallery-claude-code-cloud
            ManagedPolicyArns:
                - !Ref SamDeployPlumbingPolicy
                - !Ref DeployDevAndTestPolicy
                - !Ref IntegrationTestsPolicy
                - !Ref ReadApplicationLogsPolicy
            Policies:
                - PolicyName: NeverProd
                  # Reading prod logs is granted; changing prod is not, and nothing
                  # above grants it either. This is here so that a later widening of a
                  # shared policy cannot quietly hand production to a credential that
                  # sits in a cloud environment.
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Sid: NoProdStack
                            Effect: Deny
                            Action: cloudformation:*
                            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*
                          - Sid: NoProdData
                            # The prod log groups are deliberately absent: they are
                            # granted above, and an explicit Deny here would win.
                            Effect: Deny
                            Action:
                                - dynamodb:*
                                - s3:*
                            Resource:
                                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-prod-items
                                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-prod-items/index/*
                                - !Sub arn:aws:s3:::${StackPrefix}-prod-original-images
                                - !Sub arn:aws:s3:::${StackPrefix}-prod-original-images/*
                                - !Sub arn:aws:s3:::${StackPrefix}-prod-derived-images
                                - !Sub arn:aws:s3:::${StackPrefix}-prod-derived-images/*

Outputs:
    CloudFormationDeployRoleArn:
        Description: Pass as --role-arn to sam deploy (set as role_arn in samconfig.toml)
        Value: !GetAtt CloudFormationDeployRole.Arn
    GitHubPullRequestRoleArn:
        Description: role-to-assume for pull request runs
        Value: !GetAtt GitHubPullRequestRole.Arn
    GitHubMainRoleArn:
        Description: role-to-assume for runs on main
        Value: !GetAtt GitHubMainRole.Arn
    GitHubProdRoleArn:
        Description: role-to-assume for the prod deploy job
        Value: !GetAtt GitHubProdRole.Arn
    ClaudeCodeCloudUserName:
        Description: Create the access key for the Claude Code cloud environment against this user
        Value: !Ref ClaudeCodeCloudUser
