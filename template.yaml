      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}

  # ---------------------------------------------------------------------------
  # Lambda to shlep DynamoDB data to Redis
  # ---------------------------------------------------------------------------
  DynamoToRedisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-DynamoToRedis
      CodeUri: app/src/lambdas/dynamoToRedis/
      Handler: dynamoToRedisLambda.handler
      Description: Shlep DynamoDB data to Redis
      Events:
        DynamoDBEvent:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt GalleryItemDDBTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            # Isolate a poison record instead of failing the whole batch (bisections don't consume retries)
            BisectBatchOnFunctionError: true
            # Default (-1) retries until the record expires from the stream, blocking the shard for
            # up to 24h behind one bad record. SyncRedis can fully reconcile Redis, so give up sooner;
            # the DynamoToRedis errors alarm reports it.
            MaximumRetryAttempts: 3
      Environment:
        Variables:
          REDIS_HOST: !Ref RedisHost
          REDIS_WRITE_USERNAME: !Ref RedisWriteUsername
          REDIS_WRITE_PASSWORD: !Sub "{{resolve:secretsmanager:${RedisWritePasswordSecret}}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node24
        EntryPoints:
          - dynamoToRedisLambda.ts

