  # ---------------------------------------------------------------------------
  # Lambda that processes uploaded media (images and videos)
  # ---------------------------------------------------------------------------
  ProcessMediaUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ProcessMediaUpload
      CodeUri: app/src/lambdas/processMediaUpload/
      Handler: processMediaUploadLambda.handler
      # Pinned to x86_64: the sharp-heic layer is a native x86_64 build.
      # Rebuild that layer for arm64 to let this inherit the global arm64 setting.
      Architectures:
        - x86_64
      Description: Lambda that processes media uploaded to S3 - images get metadata extracted, videos get sent to MediaConvert
      MemorySize: 1024 # HEIC conversion needs ~400-600MB for 48MP photos
      Policies:
        - S3CrudPolicy: # CRUD needed to write converted JPEG and delete original HEIC
            BucketName: !Sub "${AWS::StackName}-original-images"
        - DynamoDBCrudPolicy:
            TableName: !Ref GalleryItemDDBTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ErrorTable
        - Statement:
            - Effect: Allow
              Action:
                - mediaconvert:CreateJob
                - mediaconvert:DescribeEndpoints
              Resource: '*'
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn
      Layers:
        # Sharp layer with HEIC support via libheif/libde265
        # I build this in an AWS Code Builder project: sharp-heic-lambda-layer
        # I tried setting this as a parameter, but it didn't update when I changed it
        - arn:aws:lambda:us-east-1:010410881828:layer:sharp-heic:2
      Events:
        FileUploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref OriginalImagesBucket
            Events:
              - s3:ObjectCreated:Put
              - s3:ObjectCreated:CompleteMultipartUpload
      Environment:
        Variables:
          GALLERY_ITEM_DDB_TABLE: !Ref GalleryItemDDBTable
          ERROR_TABLE: !Ref ErrorTable
          MEDIA_CONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
          DERIVED_IMAGES_BUCKET: !Ref DerivedImagesBucket
          # Use !Sub instead of !Ref to avoid circular dependency (this Lambda is triggered by OriginalImagesBucket)
          ORIGINAL_IMAGES_BUCKET: !Sub ${AWS::StackName}-original-images
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        Sourcemap: true
        EntryPoints:
          - processMediaUploadLambda.ts
        External:
          - sharp

  # ---------------------------------------------------------------------------
  # Lambda triggered by MediaConvert job completion events via EventBridge
  # ---------------------------------------------------------------------------
  VideoTranscodingCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-VideoTranscodingComplete
      CodeUri: app/src/lambdas/videoTranscodingComplete/
      Handler: videoTranscodingCompleteLambda.handler
      Description: Handles MediaConvert job completion - writes DynamoDB record or error
      Events:
        MediaConvertComplete:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.mediaconvert
              detail-type:
                - MediaConvert Job State Change
              detail:
                status:
                  - COMPLETE
                  - ERROR
                  - CANCELED
                userMetadata:
                  source:
                    - !Ref DerivedImagesBucket
      Environment:
        Variables:
          GALLERY_ITEM_DDB_TABLE: !Ref GalleryItemDDBTable
          ERROR_TABLE: !Ref ErrorTable
          ORIGINAL_IMAGES_BUCKET: !Ref OriginalImagesBucket
          DERIVED_IMAGES_BUCKET: !Ref DerivedImagesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GalleryItemDDBTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ErrorTable
        - S3CrudPolicy:
            BucketName: !Ref OriginalImagesBucket
        - S3CrudPolicy:
            BucketName: !Ref DerivedImagesBucket
        - Statement:
            - Effect: Allow
              Action:
                - mediaconvert:GetJob
                - mediaconvert:DescribeEndpoints
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        Sourcemap: true
        EntryPoints:
          - videoTranscodingCompleteLambda.ts

  # -----------------------------------------------------------------------------
  # Alarms. All publish to AlertsTopic, which emails AlertEmail.
  # The AlarmDescription is the body of the email: say what broke and what to do.
  # Free tier is 10 alarm metrics: prod uses 6 (the CloudFront alarm counts 2) and
  # dev uses 4 (the error alarms; the CDN rate alarm needs traffic dev never has).
  # -----------------------------------------------------------------------------

  # Most image requests failing during a period when people are actually browsing.
  # A rate is meaningless at low volume: most quiet hours hold 1-3 requests, so a
  # single 404 is a 100% error rate. Gate on >200 requests in the hour.
  ImageDistribution4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub ${AWS::StackName}-image-cdn-4xx
      AlarmDescription: >-
        More than 25% of image CDN requests returned 4xx during an hour with more than 200 requests.
        Photos are probably not loading for visitors. Check the S3 origin and the derived-image Lambda,
        then the CloudFront access logs in the cloudfront-logs bucket for the failing paths.
      ComparisonOperator: GreaterThanThreshold
      Threshold: 25
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Metrics:
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/CloudFront
              MetricName: Requests
              Dimensions:
                - Name: DistributionId
                  Value: !Ref ImageDistribution
                - Name: Region
                  Value: Global # CloudFront metrics always carry Region=Global
            Period: 3600
            Stat: Sum
        - Id: errorRate
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/CloudFront
              MetricName: 4xxErrorRate
              Dimensions:
                - Name: DistributionId
                  Value: !Ref ImageDistribution
                - Name: Region
                  Value: Global
            Period: 3600
            Stat: Average
        - Id: gatedErrorRate
          Label: 4xx error rate (only counted above 200 requests/hour)
          Expression: IF(requests > 200, errorRate, 0)
          ReturnData: true

  # Zero-500 shop: any 5xx the client saw is worth an email. This metric counts
  # caught-and-returned 500s (invisible to the Lambda Errors metric), Lambda
  # timeouts/crashes surfacing as 502, and API Gateway's own 5xx.
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SendAlerts
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: >-
        The API returned a 5xx to a client. Search log group tacocat-gallery-sam/prod for
        event = server_exception or unexpected_exception in this window; if nothing, look for a
        Lambda timeout or crash in the same window.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub Tacocat Gallery API - ${Env} # must match Globals.Api.Name exactly
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # The async Lambdas have no client to report to, so a thrown error is retried
  # and then dropped silently. Errors counts every failed attempt, including a
  # first attempt whose retry then succeeded, so one email may be a false alarm.
  ProcessMediaUploadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SendAlerts
    Properties:
      AlarmName: !Sub ${AWS::StackName}-ProcessMediaUpload-errors
      AlarmDescription: >-
        Processing an uploaded photo or video threw an error. If the retry did not succeed the
        media will not appear in the gallery. Search log group tacocat-gallery-sam/prod, streams
        named ProcessMediaUpload, around this time.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessMediaUploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  VideoTranscodingCompleteErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SendAlerts
    Properties:
      AlarmName: !Sub ${AWS::StackName}-VideoTranscodingComplete-errors
      AlarmDescription: >-
        Handling a finished MediaConvert job threw an error, so a video may be transcoded but not
        recorded in the gallery. Search log group tacocat-gallery-sam/prod, streams named
        VideoTranscodingComplete, around this time, and check the errors DynamoDB table.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref VideoTranscodingCompleteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  DynamoToRedisErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SendAlerts
    Properties:
      AlarmName: !Sub ${AWS::StackName}-DynamoToRedis-errors
      AlarmDescription: >-
        Syncing DynamoDB changes to Redis threw an error. After 3 retries the records are dropped and
        search results go stale. Invoke the SyncRedis Lambda to fully reconcile Redis, then search log
        group tacocat-gallery-sam/prod, streams named DynamoToRedis, for the cause.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DynamoToRedisFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # -----------------------------------------------------------------------------
  # Monthly cost guard rail. Budgets is account-wide, so this watches the whole
  # AWS bill, not just this stack. Budgets emails directly; no SNS involved.
  # -----------------------------------------------------------------------------
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: IsProd
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 15
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
Outputs:
  AwsApi:
    Description: AWS API URL (not used)
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Stage/

  Api:
      Description: API URL (use this)
      Value: !Sub "https://api.${GalleryAppDomain}"

  ImageDomain:
    Description: CloudFront image distribution
    Value: !Sub https://${ImageDistribution.DomainName}/

  GenerateDerivedImageUrl:
    Description: URL of lambda that generates derived images
    Value: !GetAtt GenerateDerivedImageFunctionUrl.FunctionUrl
