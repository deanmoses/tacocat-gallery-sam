# -----------------------------------------------------------------------------
# This is an AWS Serverless Application Model (SAM) template
# It defines the "stack" of AWS resources needed to run the SAM app
# -----------------------------------------------------------------------------
AWSTemplateFormatVersion: "2010-09-09"

# -----------------------------------------------------------------------------
# This file is written in SAM syntax, and gets transfomed and expanded into a
# CloudFormation template.  The CloudFormation template is what actually gets
# deployed.  The main point is that SAM syntax is much simpler, with a lot less
# boilerplate around declaring resources like Lambda functions and their
# accompanying execution roles.
# -----------------------------------------------------------------------------
Transform: AWS::Serverless-2016-10-31

# -----------------------------------------------------------------------------
# This particular template defines the back end of the Tacocat photo gallery
# -----------------------------------------------------------------------------
Description: Tacocat Gallery image storage, database, and API

# -----------------------------------------------------------------------------
# Parameters that can be specified when deploying this stack
# This is the only way to define constants for use elsewhere in the template
# -----------------------------------------------------------------------------
Parameters:
  Env:
    Description: Environment for which the infrastructure will be deployed
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    ConstraintDescription: Must be either 'dev', 'test' or 'prod'
  GalleryAppDomain:
    Description: Domain of the Tacocat photo gallery web app 
    Type: String
    AllowedValues:
      - staging-pix.tacocat.com
      - test-pix.tacocat.com
      - pix.tacocat.com
    ConstraintDescription: Must be either 'staging-pix.tacocat.com', 'test-pix.tacocat.com' or 'pix.tacocat.com'
  DomainCertificateArn:
    Description: ARN of the ACM certificate for the GalleryAppDomain domain
    Type: String
    AllowedValues:
      - arn:aws:acm:us-east-1:010410881828:certificate/092ab57c-f87d-4c44-a72c-63cfbbb55800 # staging-pix.tacocat.com
      - arn:aws:acm:us-east-1:010410881828:certificate/9fbd8ee9-f1d1-42a5-b97c-9713ce6e076d # test-pix.tacocat.com
      - arn:aws:acm:us-east-1:010410881828:certificate/e142cda0-96db-4651-92fd-35dd9a52e9a2 # pix.tacocat.com
  RedisHost:
    Description: Hostname and port of the Redis search instance
    Type: String
    AllowedValues:
      - redis-16860.c321.us-east-1-2.ec2.cloud.redislabs.com:16860 # test
      - redis-14907.c321.us-east-1-2.ec2.cloud.redislabs.com:14907 # dev
      - redis-13894.c321.us-east-1-2.ec2.cloud.redislabs.com:13894 # prod
  RedisSearchUsername:
    Description: Name of user permitted to execute a search on Redis
    Type: String
    AllowedValues:
      - testsearcher
      - devsearcher
      - prodsearcher
    ConstraintDescription: Must be testsearcher, devsearcher or prodsearcher
  RedisWriteUsername:
    Description: Name of user permitted to write to Redis
    Type: String
    AllowedValues:
      - testwriter
      - devwriter
      - prodwriter
    ConstraintDescription: Must be testwriter, devwriter or prodwriter
  RedisSearchPasswordSecret:
    Description: AWS Secrets Manager reference for Redis search password
    Type: String
    AllowedValues:
      - Tacocat/Gallery/Authentication:SecretString:RedisSearchPasswordTest
      - Tacocat/Gallery/Authentication:SecretString:RedisSearchPasswordDev
      - Tacocat/Gallery/Authentication:SecretString:RedisSearchPasswordProd
  RedisWritePasswordSecret:
    Description: AWS Secrets Manager reference for Redis write password
    Type: String
    AllowedValues:
      - Tacocat/Gallery/Authentication:SecretString:RedisWritePasswordTest
      - Tacocat/Gallery/Authentication:SecretString:RedisWritePasswordDev
      - Tacocat/Gallery/Authentication:SecretString:RedisWritePasswordProd
  CognitoUserPoolID:
    Description: Cognito User Pool ID for authentication
    Type: String
  CognitoClientID:
    Description: Cognito App Client ID for authentication
    Type: String
  AlertEmail:
    Description: Email address that receives CloudWatch alarm (prod and dev) and AWS Budget (prod) notifications
    Type: String

# -----------------------------------------------------------------------------
# Conditions are boolean conditions that can be used to control resources
# -----------------------------------------------------------------------------
Conditions:
  IsProd: !Equals [ !Ref Env, "prod" ]
  # Alarms that mean "something threw" also run in dev, where bugs surface during manual
  # testing. Prod 6 + dev 4 = 10 alarm metrics, exactly the CloudWatch always-free tier.
  SendAlerts: !Or [ !Condition IsProd, !Equals [ !Ref Env, "dev" ] ]

# -----------------------------------------------------------------------------
# Configuration properties inherited by all resources, such as Lambda functions
# -----------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    # 256MB gives only ~0.15 vCPU, which throttled both init and request handling.
    # Lambda bills GB-seconds, so faster-at-more-memory is roughly cost neutral.
    MemorySize: 1024
    # Graviton: ~20% cheaper per GB-second and typically faster for Node.
    # The two Sharp functions override this back to x86_64 (see below).
    Architectures:
      - arm64
    Timeout: 100 # TODO decrease this; the default is 3!
    LoggingConfig:
      LogFormat: JSON
      # One log group for the whole stack so retention is set once, as code.
      # Lambda names each stream with the function name, so filtering still works.
      LogGroup: !Ref GalleryLogGroup
    Environment:
        Variables:
          GALLERY_APP_DOMAIN: !Ref GalleryAppDomain
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolID
          COGNITO_CLIENT_ID: !Ref CognitoClientID
  Api:
    Name: !Sub Tacocat Gallery API - ${Env}
    MinimumCompressionSize: 1000 # Gzip/brotli responses over 1KB
    OpenApiVersion: '3.0.1' # Stops SAM creating unused "Stage" stage
    Domain:
      DomainName: !Sub api.${GalleryAppDomain}
      CertificateArn: !Ref DomainCertificateArn
    Cors:
      AllowMethods: "'GET,OPTIONS,HEAD,POST,PUT,PATCH,DELETE'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: !Sub "'https://${GalleryAppDomain}'"
      AllowCredentials: true

# -----------------------------------------------------------------------------
# Resources are the actual AWS assets to be provisioned
# -----------------------------------------------------------------------------
Resources:
  # -----------------------------------------------------------------------------
  # CloudWatch log group shared by every Lambda in the stack
  # -----------------------------------------------------------------------------
  GalleryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      LogGroupName: !Sub tacocat-gallery-sam/${Env} # Lambda refuses custom log groups that start with aws/
      RetentionInDays: !If [ "IsProd", 90, 30 ]

  # -----------------------------------------------------------------------------
  # Alerting: CloudWatch alarms publish to this topic; prod and dev email a human.
  # Alarm emails are rendered by SNS as readable text, including AlarmDescription.
  # -----------------------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: SendAlerts
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail # SNS sends a confirmation email that must be clicked once

  # -----------------------------------------------------------------------------
  # S3 bucket for CloudFront access logs (standard logging v2, delivered by
  # CloudWatch Logs). No ACLs: S3's default bucket-owner-enforced setting accepts
  # the bucket-owner-full-control header that log delivery sends.
  # -----------------------------------------------------------------------------
  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      BucketName: !Sub ${AWS::StackName}-cloudfront-logs
      LifecycleConfiguration:
        Rules:
          - Id: Expire Old Logs
            ExpirationInDays: 90
            Status: Enabled

  CloudFrontLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogsDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${CloudFrontLogsBucket.Arn}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*

  # -----------------------------------------------------------------------------
  # S3 bucket for original images
  # -----------------------------------------------------------------------------
  OriginalImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      BucketName: !Sub ${AWS::StackName}-original-images
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: Delete Old Versions
            NoncurrentVersionExpirationInDays: 24 # delete old versions after 24 days
            ExpiredObjectDeleteMarker: true
            Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT # used by presigned URLs to upload images
            AllowedOrigins:
#              - "*"
              - !Sub "https://${GalleryAppDomain}"
            ExposedHeaders:
              - ETag
              - x-amz-version-id # Necessary so that client can receive version ID of uploaded image

  # -----------------------------------------------------------------------------
  # S3 bucket for derived images
  # -----------------------------------------------------------------------------
  DerivedImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      BucketName: !Sub ${AWS::StackName}-derived-images

  # -----------------------------------------------------------------------------
  # DynamoDB table containing the album and image metadata
  # -----------------------------------------------------------------------------
  GalleryItemDDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    UpdateReplacePolicy: !If [ "IsProd", "Retain", "Delete" ] # don't delete in prod
    Properties:
      TableName: !Sub ${AWS::StackName}-items
      AttributeDefinitions:
        - AttributeName: parentPath
          AttributeType: S
        - AttributeName: itemName
          AttributeType: S
      KeySchema:
        - AttributeName: parentPath
          KeyType: HASH
        - AttributeName: itemName
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 3
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # -----------------------------------------------------------------------------
  # Table for errors the client needs to know about - media processing etc
  # -----------------------------------------------------------------------------
  ErrorTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete # Errors are transient, no need to retain
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub ${AWS::StackName}-errors
      AttributeDefinitions:
        - AttributeName: path
          AttributeType: S
      KeySchema:
        - AttributeName: path
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST # On-demand pricing, errors should be rare
      OnDemandThroughput:
        MaxReadRequestUnits: 10
        MaxWriteRequestUnits: 10
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -----------------------------------------------------------------------------
  # MediaConvert IAM role for video transcoding
  # -----------------------------------------------------------------------------
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-mediaconvert-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${AWS::StackName}-original-images/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${AWS::StackName}-derived-images/i/*

  # -----------------------------------------------------------------------------
  # CloudFront CDN distribution that serves the images
  # -----------------------------------------------------------------------------

  # CloudFront distibution
  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Images for ${AWS::StackName}
        # Without this CloudFormation defaults to http1.1, which caps the browser at
        # ~6 concurrent connections -- painful for an album of 65 thumbnails
        HttpVersion: http2and3
        Aliases:
        - !Sub img.${GalleryAppDomain}
        ViewerCertificate:
          AcmCertificateArn: !Ref DomainCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: original-images-bucket
            DomainName: !GetAtt OriginalImagesBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OriginalImagesCloudFrontOriginAccessIdentity}
          - Id: derived-images-bucket
            DomainName: !GetAtt DerivedImagesBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${DerivedImagesCloudFrontOriginAccessIdentity}
          - Id: generate-derived-image-lambda
            DomainName: # parse DomainName from FunctionUrl which looks like 'https://12341232.lambda-url.on.aws/'
              !Select [
                2,
                !Split [
                  "/",
                  !Select [
                    1,
                    !Split [
                      ":",
                      !GetAtt GenerateDerivedImageFunctionUrl.FunctionUrl,
                    ],
                  ],
                ],
              ]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
            # CloudFront signs each request with SigV4 so the function URL can require
            # IAM auth (see GenerateDerivedImageFunction). Without this the URL is public
            # and anyone who finds it bypasses the CDN: no cache, no logs, no headers,
            # and a Sharp invocation per hit.
            OriginAccessControlId: !GetAtt DerivedImageLambdaOriginAccessControl.Id
        CacheBehaviors:
          - PathPattern: /i/*
            TargetOriginId: derived-images-group
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref ImmutableCachePolicy
            ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DerivedImagesUrlRewriteFunction.FunctionMetadata.FunctionARN
          - PathPattern: /v/*
            TargetOriginId: derived-images-bucket
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref ImmutableCachePolicy
            ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt VideoPlaybackUrlRewriteFunction.FunctionMetadata.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: original-images-bucket
          Compress: true
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
          ResponseHeadersPolicyId: !Ref DefaultResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RobotsTxtFunction.FunctionMetadata.FunctionARN
        OriginGroups:
          Quantity: 1
          Items:
            - Id: derived-images-group
              FailoverCriteria:
                StatusCodes:
                  Quantity: 2
                  Items: [403, 404] # S3 will return 403 instead of 404 when s3:ListBucket permission is not given
              Members:
                Quantity: 2
                Items:
                  - OriginId: derived-images-bucket
                  - OriginId: generate-derived-image-lambda

  # ---------------------------------------------------------------------------
  # CloudFront standard logging (v2) for the image distribution -> S3.
  # Three CloudWatch Logs resources: source (the distribution), destination
  # (the bucket), and the delivery that pairs them. Must live in us-east-1.
  # Enabled in every environment so the wiring is proven in dev before prod.
  # ---------------------------------------------------------------------------
  ImageLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub ${AWS::StackName}-image-cdn
      LogType: ACCESS_LOGS
      ResourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}

  ImageLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub ${AWS::StackName}-image-cdn-s3
      DestinationResourceArn: !GetAtt CloudFrontLogsBucket.Arn
      OutputFormat: w3c # tab-separated with a #Fields header; cannot be changed without replacing this resource

  ImageLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn:
      - ImageLogDeliverySource
      - CloudFrontLogsBucketPolicy
    Properties:
      DeliverySourceName: !Sub ${AWS::StackName}-image-cdn # must equal ImageLogDeliverySource.Name
      DeliveryDestinationArn: !GetAtt ImageLogDeliveryDestination.Arn
      S3SuffixPath: image/{yyyy}/{MM}/{dd}/
      # Naming RecordFields at all means listing every field wanted; there is no
      # add-to-the-default form. This is CloudFront's default minus cs(Cookie),
      # x-forwarded-for, fle-* and sc-range-*, which this distribution cannot
      # populate, plus asn and c-country. asn is what separates real visitors
      # from automated traffic; user agents don't. Order sets the column order.
      # Same list as the SPA distribution in tacocat-gallery-hosting-aws.
      RecordFields:
        - date
        - time
        - x-edge-location
        - sc-bytes
        - c-ip
        - cs-method
        - cs(Host)
        - cs-uri-stem
        - sc-status
        - cs(Referer)
        - cs(User-Agent)
        - cs-uri-query
        - x-edge-result-type
        - x-edge-request-id
        - x-host-header
        - cs-protocol
        - cs-bytes
        - time-taken
        - ssl-protocol
        - ssl-cipher
        - x-edge-response-result-type
        - cs-protocol-version
        - c-port
        - time-to-first-byte
        - x-edge-detailed-result-type
        - sc-content-type
        - sc-content-len
        - asn
        - c-country

  # ---------------------------------------------------------------------------
  # Response headers policies. A behavior gets exactly one policy, so the
  # crawler opt-out and security headers are repeated in both policies below.
  # Keep the two blocks identical; the integration tests fail if they drift.
  #
  # Crawler opt-out: X-Robots-Tag is Google's documented control for indexing
  # a non-HTML file such as an image or video. robots.txt and X-Robots-Tag are
  # per host, so the SPA's noindex on pix.tacocat.com says nothing about this
  # host. The SPA's noimageindex covers photos discovered through its pages;
  # this covers the files themselves.
  #   noindex, noimageindex: the file (image, video, or 400 error) never appears
  #     in web or image results. No nosnippet/notranslate/max-image-preview: those
  #     only mean something on an HTML page.
  #   noai, noimageai: a DeviantArt-origin convention, absent from Google's
  #     documented directives. Kept because they cost nothing.
  #   tdm-reservation: W3C TDMRep, 1 = rights reserved. Legal rather than
  #     technical: EU DSM Article 4 permits commercial text/data mining unless
  #     reserved "by machine-readable means". This is that reservation.
  #
  # Security: HSTS matches the SPA's (1 year, includeSubDomains, no preload);
  # nosniff stops a browser second-guessing the content type. Frame, referrer
  # and permissions policies are per-document and would say nothing on media.
  #
  # Cross-Origin-Resource-Policy: same-site stops other websites embedding the
  # photos with <img> or <video>; the gallery app is the same site (tacocat.com)
  # so it is unaffected. Prod only: the gallery's local dev server (localhost)
  # loads images straight from img.staging-pix.tacocat.com, and localhost is
  # not same-site with anything. cross-origin is the header's no-op value.
  # ---------------------------------------------------------------------------

  # Default behavior: original files and the function-generated robots.txt
  DefaultResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub DefaultResponseHeadersPolicy-${AWS::StackName}
        Comment: !Sub Crawler opt-out and security headers for ${AWS::StackName}
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000 # 1 year
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: # emits X-Content-Type-Options: nosniff
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, noimageindex, noai, noimageai
              Override: true
            - Header: tdm-reservation
              Value: "1"
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: !If [IsProd, same-site, cross-origin]
              Override: true

  # /i/* and /v/*: derived images and transcoded video. Cache forever, plus the
  # same crawler and security block as DefaultResponseHeadersPolicy.
  ImmutableResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties: 
      ResponseHeadersPolicyConfig: 
        Name: !Sub ImmutableResponseHeadersPolicy-${AWS::StackName}
        Comment: !Sub Immutable response headers policy for ${AWS::StackName}
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000 # 1 year
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: # emits X-Content-Type-Options: nosniff
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, noimageindex, noai, noimageai
              Override: true
            - Header: tdm-reservation
              Value: "1"
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: !If [IsProd, same-site, cross-origin]
              Override: true
            - Header: Cache-Control
              Value: public, max-age=31536000, immutable
              Override: true
            # Lets the gallery app read the full Resource Timing entry for thumbnails
            # (nextHopProtocol, transferSize, DNS/TCP/TLS). Cross-origin timings are
            # zeroed out without it. Applied on cache hits too, so no invalidation needed.
            - Header: Timing-Allow-Origin
              Value: !Sub https://${GalleryAppDomain}
              Override: true

  # Caching policy to cache forever
  ImmutableCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ImmutableCachePolicy-${AWS::StackName}
        Comment: Cache for a year
        DefaultTTL: 31536000 # 1 year
        MaxTTL: 31536000 # 1 year
        MinTTL: 31536000 # 1 year
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Allow CloudFront to read from the original images bucket
  OriginalImagesBucketCloudFrontReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginalImagesBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub arn:aws:s3:::${OriginalImagesBucket}/*
            Principal:
              CanonicalUser: !GetAtt OriginalImagesCloudFrontOriginAccessIdentity.S3CanonicalUserId

  # CloudFront identity of the original image bucket
  OriginalImagesCloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Ref OriginalImagesBucket

  # Allow CloudFront to read from the derived images bucket
  DerivedImagesBucketCloudFrontReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DerivedImagesBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub arn:aws:s3:::${DerivedImagesBucket}/*
            Principal:
              CanonicalUser: !GetAtt DerivedImagesCloudFrontOriginAccessIdentity.S3CanonicalUserId

  # CloudFront identity of the derived image bucket
  DerivedImagesCloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Ref DerivedImagesBucket

  # Serves /robots.txt on the default behavior. From a function, not an S3
  # file, so it can't be deleted or overwritten by a media upload.
  # Same list and rationale as the SPA's robots.txt in tacocat-gallery-hosting-aws;
  # duplicated because CloudFormation requires the function code inline. Keep
  # the two in sync.
  RobotsTxtFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub RobotsTxt-${AWS::StackName}
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub Serves robots.txt; crawling allowed so X-Robots-Tag is seen, for ${AWS::StackName}
        Runtime: cloudfront-js-2.0
      FunctionCode: |+2
        // Blocked by name because they only train, so there's no listing to
        // lose. Google-Extended and Applebot-Extended govern training alone --
        // Googlebot and Applebot still crawl, and indexing is unaffected.
        // Sorted, so a duplicate is visible on sight. Curated rather than
        // exhaustive: published lists run to 60+ but carry dead operators and
        // library UAs like Scrapy, which no one sets honestly.
        // The -User and -SearchBot agents are retrieval, not training. Blocking
        // them contradicts the allow-so-noindex-is-seen logic below, and it is
        // deliberate: unlike Google these have no de-indexing pathway to
        // preserve, so there is no listing to protect by letting them in.
        const AI_TRAINING_BOTS = [
            'AI2Bot',
            'Amazonbot',
            'anthropic-ai',
            'Applebot-Extended',
            'Bytespider',
            'CCBot',
            'ChatGPT-User',
            'Claude-SearchBot',
            'Claude-User',
            'Claude-Web',
            'ClaudeBot',
            'cohere-ai',
            'Diffbot',
            'DuckAssistBot',
            'FacebookBot',
            'Google-CloudVertexBot',
            'Google-Extended',
            'GPTBot',
            'ImagesiftBot',
            'img2dataset',
            'Meta-ExternalAgent',
            'meta-externalfetcher',
            'MistralAI-User',
            'OAI-SearchBot',
            'omgili',
            'omgilibot',
            'PanguBot',
            'Perplexity-User',
            'PerplexityBot',
            'SemrushBot-OCOB',
            'Timpibot',
            'Webzio-Extended',
            'YouBot',
        ];
        function handler(event) {
            const r = event.request;
            if (r.uri !== '/robots.txt') return r;
            // Crawling is allowed in order to stay OUT of search results: a
            // crawler must fetch a file to see its X-Robots-Tag. A Disallow here
            // would hide the noindex and leave bare URLs listed instead.
            let body = 'User-agent: *\nAllow: /\n\n';
            // Index loop: cloudfront-js-2.0 rejects for...of at publish time
            for (let i = 0; i < AI_TRAINING_BOTS.length; i++) body += 'User-agent: ' + AI_TRAINING_BOTS[i] + '\n';
            body += 'Disallow: /\n';
            return {
                statusCode: 200,
                statusDescription: 'OK',
                headers: { 'content-type': { value: 'text/plain; charset=utf-8' } },
                body: { encoding: 'text', data: body },
            };
        }

  # CloudFront Function to rewrite video playback URL
  # Input: /v/2024/06-15/video.mp4?version=<versionId>
  # Output: /i/2024/06-15/video.mp4/<versionId>/video-transcoded
  VideoPlaybackUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub RewriteVideoPlaybackUrl-${AWS::StackName}
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub Rewrite video playback URL for ${AWS::StackName}
        Runtime: cloudfront-js-2.0
      FunctionCode: |+2
        function handler(event) {
            const r = event.request;
            const version = r.querystring['version'];
            if (!version) return error('Missing Version');
            // r.uri is like /v/2024/06-15/video.mp4 -> extract /2024/06-15/video.mp4
            const path = r.uri.substring(2);
            r.uri = '/i' + path + '/' + version.value + '/video-transcoded';
            r.querystring = {};
            return r;
        }
        // HTTP/2 and HTTP/3 dropped the reason phrase, so statusDescription reaches
        // almost no one: this distribution sets HttpVersion http2and3.  Carry the reason
        // in a JSON body instead, in the same { errorMessage } shape that the API's
        // handleHttpExceptions() returns, so clients parse CDN and API errors the same way.
        function error(errorMessage) {
            return {
                statusCode: 400,
                statusDescription: errorMessage,
                headers: { 'content-type': { value: 'application/json' } },
                body: JSON.stringify({ errorMessage: errorMessage }),
            };
        }

  # CloudFront Function to rewrite URL to derived images bucket
  DerivedImagesUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub RewriteDerivedImagesUrl-${AWS::StackName}
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub Rewrite URL to derived images bucket for ${AWS::StackName}
        Runtime: cloudfront-js-2.0
      FunctionCode: |+2
        function handler(event) {
            const r = event.request;
            const v = r.querystring['version'], c = r.querystring['crop'], s = r.querystring['size'];
            if (!v) return error('Missing Version');
            if (!s) return error('Missing Size');
            r.uri += path(v) + path(s) + crop(c);
            r.querystring = {};
            return r;
        }
        function path(p) { return p ? '/' + p.value : ''; }
        function crop(p) { return p ? '/crop=' + p.value : ''; }
        // HTTP/2 and HTTP/3 dropped the reason phrase, so statusDescription reaches
        // almost no one: this distribution sets HttpVersion http2and3.  Carry the reason
        // in a JSON body instead, in the same { errorMessage } shape that the API's
        // handleHttpExceptions() returns, so clients parse CDN and API errors the same way.
        function error(errorMessage) {
            return {
                statusCode: 400,
                statusDescription: errorMessage,
                headers: { 'content-type': { value: 'application/json' } },
                body: JSON.stringify({ errorMessage: errorMessage }),
            };
        }

  # ---------------------------------------------------------------------------
  # Lambda to generate derived images
  # ---------------------------------------------------------------------------
  GenerateDerivedImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GenerateDerivedImage
      CodeUri: app/src/lambdas/generateDerivedImage/
      Handler: generateDerivedImageLambda.handler
      # Pinned to x86_64: the sharp-heic layer is a native x86_64 build.
      # Rebuild that layer for arm64 to let this inherit the global arm64 setting.
      Architectures:
        - x86_64
      Description: Generates derived images
      MemorySize: 1024 # Sharp is CPU-bound; at the inherited 256MB (~0.14 vCPU) this averaged 3.7s
      Environment:
        Variables:
          ORIGINAL_IMAGES_BUCKET: !Ref OriginalImagesBucket
          DERIVED_IMAGES_BUCKET: !Ref DerivedImagesBucket
          GALLERY_ITEM_DDB_TABLE: !Ref GalleryItemDDBTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref OriginalImagesBucket
        - S3ReadPolicy: # Read video posters
            BucketName: !Ref DerivedImagesBucket
        - S3WritePolicy: # Write resized images
            BucketName: !Ref DerivedImagesBucket
        - DynamoDBReadPolicy:
            TableName: !Ref GalleryItemDDBTable
      Layers:
        # Sharp layer with HEIC support via libheif/libde265
        # I build this in an AWS Code Builder project: sharp-heic-lambda-layer
        # I tried setting this as a parameter, but it didn't update when I changed it
        - arn:aws:lambda:us-east-1:010410881828:layer:sharp-heic:2
      FunctionUrlConfig:
        # Only CloudFront may call this URL
        AuthType: AWS_IAM
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node24
        EntryPoints:
          - generateDerivedImageLambda.ts
        External:
          - sharp

  # CloudFront signs requests to the derived-image Lambda URL with SigV4.
  # Attached to the origin inside ImageDistribution.
  DerivedImageLambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub DerivedImageLambda-${AWS::StackName}
        Description: !Sub Signs CloudFront requests to the derived-image Lambda URL for ${AWS::StackName}
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # The two grants AWS documents for OAC on a function URL, scoped to this
  # distribution so no other distribution (or account) can invoke it.
  GenerateDerivedImageCloudFrontUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref GenerateDerivedImageFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}

  GenerateDerivedImageCloudFrontInvokePermission:
    Type: AWS::Lambda::Permission
